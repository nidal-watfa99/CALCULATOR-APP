<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الحاسبة الشاملة</title>
<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,Tahoma,Arial,sans-serif}
#app{max-width:520px;margin:auto;height:100%;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px}.bar h1{flex:1;font-size:22px;margin:0}
button{font:inherit;color:inherit;background:var(--k);border:0;border-radius:16px;padding:10px 14px;cursor:pointer}
.sc{flex:1;overflow:auto;padding:0 16px 90px}.card{background:var(--c);border-radius:18px;padding:14px;margin:10px 0}
input,select{width:100%;font:inherit;color:var(--t);background:var(--k);border:0;border-radius:14px;padding:13px;box-sizing:border-box}
label{display:block;color:var(--m);font-size:14px;margin:12px 4px 4px}.hint{color:var(--m);font-size:13px;margin:8px 4px}
.tl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer}.tl small{display:block;color:var(--m)}.tl span.n{flex:1}
.ic{font-size:28px;width:40px;text-align:center}.st{color:var(--a);font-size:22px;padding:4px 8px}
.fav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fav div{text-align:center;padding:12px 4px;border-radius:14px;background:var(--k);cursor:pointer;font-size:14px}.fav b{display:block;font-size:30px}
h3{color:var(--m);font-size:14px;font-weight:400;margin:18px 6px 4px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:56px;height:56px;border-radius:18px;background:var(--ak);color:#111;font-size:26px;padding:0}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--k)}.res b{text-align:left;direction:ltr;word-break:break-all}
.dsp{flex:1;direction:ltr;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:16px;overflow:hidden;text-align:right}
.ex{font-size:44px;word-break:break-all}.pv{font-size:24px;color:var(--m);min-height:30px}.mm{font-size:13px;color:var(--a);min-height:16px}
.kp{direction:ltr;padding:8px 12px 14px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.g button{height:clamp(50px,8.6vh,70px);border-radius:36px;font-size:24px;padding:0}.g.s button{background:none;font-size:18px;height:40px}

.dev-name{font-size:11px;font-style:italic;color:#7af;text-shadow:0 0 6px rgba(100,160,255,.7),0 0 12px rgba(80,140,255,.35);animation:devPulse 2.4s ease-in-out infinite;white-space:nowrap;letter-spacing:.5px}
@keyframes devPulse{0%,100%{opacity:1;text-shadow:0 0 6px rgba(100,160,255,.7),0 0 12px rgba(80,140,255,.35)}50%{opacity:.7;text-shadow:0 0 4px rgba(100,160,255,.4),0 0 8px rgba(80,140,255,.2)}}
.warn-n{color:#4caf50}.warn-l{color:#ff9800}.warn-h{color:#ff5722}.warn-c{color:#f44336;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;margin-inline-start:6px}
.badge-n{background:rgba(76,175,80,.2);color:#4caf50}.badge-l{background:rgba(255,152,0,.2);color:#ff9800}
.badge-h{background:rgba(255,87,34,.2);color:#ff5722}.badge-c{background:rgba(244,67,54,.25);color:#f44336}
.sci-card{background:var(--c);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer;border:1px solid transparent}

.lab-card .abbr{direction:ltr;color:var(--a);font-weight:600}

.contact-card a{color:var(--a);text-decoration:none}
.bar-right{display:flex;align-items:center;gap:8px;margin-inline-start:auto}

.console-fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:16px;width:44px;height:44px;border-radius:14px;background:#1a2332;color:#7af;font-size:18px;padding:0;z-index:90;border:1px solid rgba(100,160,255,.35);box-shadow:0 0 10px rgba(80,140,255,.25);display:none}
.console-fab.has-err{color:#f66;border-color:rgba(255,80,80,.5);box-shadow:0 0 10px rgba(255,60,60,.3);animation:livePulse 1.6s ease-in-out infinite}
.console-panel{position:fixed;inset:auto 0 0 0;max-height:55%;background:var(--c);border-radius:18px 18px 0 0;z-index:100;display:none;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.console-panel.open{display:flex}
.console-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--k)}
.console-hd h2{flex:1;margin:0;font-size:16px}

.console-body .err-row.info{border-inline-start-color:#4caf50}

.console-body .err-msg{color:#f88;word-break:break-word;margin-top:4px}

.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.dev-grid button{font-size:13px;padding:12px 8px}
.app-title{text-align:center;font-size:28px;font-weight:800;letter-spacing:.5px;line-height:1.3;padding:2px 12px 0;margin:0;user-select:none;
background:linear-gradient(115deg,#7a5a08 0%,#c99700 14%,#ffd54f 28%,#fff8d6 38%,#ffd54f 48%,#b8860b 62%,#f5c518 78%,#fff2a8 88%,#7a5a08 100%);background-size:300% 300%;
-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(255,200,40,.35));animation:goldShine 4s linear infinite}

.rate-status{font-size:12px;color:var(--m);margin:6px 0}
.rate-status.ok{color:#4caf50}.rate-status.err{color:#f66}.rate-status.loading{color:var(--a)}

// ===== نظام تتبع الأخطاء (Developer Console) =====
const ERR_LOG=[];
const MAX_ERR=80;
function pushErr(type,msg,stack){
  const e={t:Date.now(),type:type||'error',msg:String(msg||''),stack:stack?String(stack).slice(0,800):''};
  ERR_LOG.unshift(e);if(ERR_LOG.length>MAX_ERR)ERR_LOG.pop();
  try{ST.s('errlog',ERR_LOG.slice(0,40))}catch(x){}
  updateConsoleBadge();
}
try{const saved=ST.g('errlog',[]);if(Array.isArray(saved))saved.forEach(e=>ERR_LOG.push(e))}catch(x){}
addEventListener('error',ev=>{pushErr('error',ev.message||ev.error||'Error',ev.error&&ev.error.stack);});
addEventListener('unhandledrejection',ev=>{const r=ev.reason;pushErr('error',r&&r.message?r.message:String(r),r&&r.stack);});
const _origErr=console.error.bind(console);
console.error=function(...a){try{pushErr('error',a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '))}catch(x){}_origErr(...a)};
const _origWarn=console.warn.bind(console);
console.warn=function(...a){try{pushErr('warn',a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '))}catch(x){}_origWarn(...a)};

function updateConsoleBadge(){
  const b=Q('#cfab');if(!b)return;
  const show=ST.g('showConsole',false);
  b.style.display=show?'flex':'none';
  const has=ERR_LOG.some(e=>e.type==='error');
  b.classList.toggle('has-err',has);
  b.title=has?L('أخطاء مسجّلة')+' ('+ERR_LOG.filter(e=>e.type==='error').length+')':L('وحدة التحكم');
}
function ensureConsoleUI(){
  if(Q('#cpanel'))return;
  const fab=E('button','console-fab','🛠');fab.id='cfab';fab.onclick=()=>toggleConsole();
  document.body.append(fab);
  const panel=E('div','console-panel');panel.id='cpanel';
  panel.innerHTML=`<div class="console-hd"><h2>🛠 ${L('وحدة التحكم')}</h2><button id=cclr type="button">${L('مسح')}</button><button id=ccls type="button">✕</button></div><div class="console-body" id=cbody></div>`;
  document.body.append(panel);
  Q('#ccls').onclick=()=>toggleConsole(false);
  Q('#cclr').onclick=()=>{ERR_LOG.length=0;ST.s('errlog',[]);renderConsole();updateConsoleBadge()};
  updateConsoleBadge();
}
function toggleConsole(force){
  ensureConsoleUI();
  const p=Q('#cpanel');
  const open=force===undefined?!p.classList.contains('open'):!!force;
  p.classList.toggle('open',open);
  if(open)renderConsole();
}
function renderConsole(){
  const b=Q('#cbody');if(!b)return;
  if(!ERR_LOG.length){b.innerHTML='<div style="color:var(--m);padding:16px;text-align:center">'+L('لا توجد سجلات')+'</div>';return}
  b.innerHTML=ERR_LOG.map(e=>{
    const d=new Date(e.t);
    const ts=d.toLocaleString(LC,{hour12:false});
    const cls=e.type==='warn'?'warn':e.type==='info'?'info':'';
    return `<div class="err-row ${cls}"><div class="err-ts">[${ts}] ${e.type.toUpperCase()}</div><div class="err-msg">${escHtml(e.msg)}</div>${e.stack?`<div class="err-stack">${escHtml(e.stack)}</div>`:''}</div>`;
  }).join('');
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function logInfo(msg){pushErr('info',msg);};

// ===== جلب أسعار الصرف من مصدر حي (Frankfurter/ECB + fallback) =====
// Frankfurter.app مبني على بيانات البنك المركزي الأوروبي (ECB) — مجاني بدون مفتاح
// open.er-api.com كاحتياطي لتغطية عملات إضافية
async function fetchLiveRates(){
  const codes=CUR.map(x=>x[2]).filter(c=>c&&c!=='USD');
  let rates={}, source='', date='';
  // 1) محاولة Frankfurter (ECB)
  try{
    const url='https://api.frankfurter.app/latest?from=USD&to='+codes.join(',');
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('Frankfurter HTTP '+res.status);
    const data=await res.json();
    if(data&&data.rates){
      rates={...data.rates};source='Frankfurter (ECB)';date=data.date||'';
      logInfo('Frankfurter rates OK: '+Object.keys(data.rates).length+' currencies, date '+date);
    }
  }catch(e){
    pushErr('warn','Frankfurter: '+(e.message||e));
  }
  // 2) احتياطي: open.er-api.com لتغطية العملات الناقصة
  const missing=codes.filter(c=>!rates[c]);
  if(missing.length){
    try{
      const res=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
      if(!res.ok)throw new Error('open.er-api HTTP '+res.status);
      const data=await res.json();
      if(data&&data.rates){
        missing.forEach(c=>{if(data.rates[c])rates[c]=data.rates[c]});
        if(!source){source='ExchangeRate-API';date=data.time_last_update_utc||''}
        else source+=' + ExchangeRate-API (fill)';
        logInfo('open.er-api fill: '+missing.filter(c=>rates[c]).length+'/'+missing.length);
      }
    }catch(e){
      pushErr('warn','open.er-api: '+(e.message||e));
    }
  }
  if(!Object.keys(rates).length)throw new Error(L('تعذر جلب الأسعار من الشبكة'));
  // حفظ: الاسم العربي → السعر مقابل 1 USD
  const stored=ST.g('rt',{});
  CUR.forEach(([name,def,code])=>{
    if(code==='USD'){stored[name]=1;return}
    if(rates[code]>0)stored[name]=rates[code];
  });
  ST.s('rt',stored);
  ST.s('rtMeta',{source,date,at:Date.now()});
  return {rates,source,date,stored};
}

function labStatus(test,val){
  if(!ok(val))return null;
  const{low,high,critLow,critHigh}=test;
  if(critLow!=null&&val<critLow)return'c';
  if(critHigh!=null&&val>critHigh)return'c';
  if(low!=null&&val<low)return'l';
  if(high!=null&&val>high)return'h';
  return'n';
}
function labBadge(st){
  if(st=='n')return'<span class="badge badge-n">'+L('طبيعي')+'</span>';
  if(st=='l')return'<span class="badge badge-l">'+L('منخفض')+'</span>';
  if(st=='h')return'<span class="badge badge-h">'+L('مرتفع')+'</span>';
  if(st=='c')return'<span class="badge badge-c">'+L('حرج')+'</span>';
  return'';
}
function labWarn(st){
  if(st=='c')return'<div class="disc warn-c">⚠️ '+L('قيمة حرجة: يُنصح بمراجعة مختص رعاية صحية فوراً. هذه المعلومات تعليمية وليست تشخيصاً طبياً.')+'</div>';
  if(st=='l'||st=='h')return'<div class="disc warn-h">⚠️ '+L('القيمة خارج النطاق المرجعي الشائع. راجع مختصاً للتفسير. النطاقات تختلف بين المختبرات.')+'</div>';
  if(st=='n')return'<div class="disc warn-n">✓ '+L('ضمن النطاق المرجعي التقريبي.')+'</div>';
  return'';
}

async function fetchMetalPrices(){
  const stored=ST.g('metals',{});
  let source='Coinbase',okCount=0;
  for(const m of METALS_DB){
    if(!m.code)continue;
    try{
      const res=await fetch('https://api.coinbase.com/v2/prices/'+m.code+'-USD/spot',{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      const amt=parseFloat(data&&data.data&&data.data.amount);
      if(amt>0){stored[m.id]=amt;okCount++;}
    }catch(e){pushErr('warn','Metal '+m.code+': '+(e.message||e));}
  }
  if(okCount===0)throw new Error(L('تعذر جلب أسعار المعادن'));
  ST.s('metals',stored);
  ST.s('metalsMeta',{source,at:Date.now(),count:okCount});
  return {stored,source,count:okCount};
}
