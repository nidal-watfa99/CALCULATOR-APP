<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الحاسبة الشاملة</title>
<style>

html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:16px system-ui,Tahoma,Arial,sans-serif}
#app{max-width:520px;margin:auto;height:100%;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px}.bar h1{flex:1;font-size:22px;margin:0}
button{font:inherit;color:inherit;background:var(--k);border:0;border-radius:16px;padding:10px 14px;cursor:pointer}
.sc{flex:1;overflow:auto;padding:0 16px 90px}.card{background:var(--c);border-radius:18px;padding:14px;margin:10px 0}
input,select{width:100%;font:inherit;color:var(--t);background:var(--k);border:0;border-radius:14px;padding:13px;box-sizing:border-box}
label{display:block;color:var(--m);font-size:14px;margin:12px 4px 4px}.hint{color:var(--m);font-size:13px;margin:8px 4px}
.tl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer}.tl small{display:block;color:var(--m)}.tl span.n{flex:1}
.ic{font-size:28px;width:40px;text-align:center}.st{color:var(--a);font-size:22px;padding:4px 8px}
.fav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fav div{text-align:center;padding:12px 4px;border-radius:14px;background:var(--k);cursor:pointer;font-size:14px}.fav b{display:block;font-size:30px}
h3{color:var(--m);font-size:14px;font-weight:400;margin:18px 6px 4px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;width:56px;height:56px;border-radius:18px;background:var(--ak);color:#111;font-size:26px;padding:0}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--k)}.res b{text-align:left;direction:ltr;word-break:break-all}
.dsp{flex:1;direction:ltr;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:16px;overflow:hidden;text-align:right}
.ex{font-size:44px;word-break:break-all}.pv{font-size:24px;color:var(--m);min-height:30px}.mm{font-size:13px;color:var(--a);min-height:16px}
.kp{direction:ltr;padding:8px 12px 14px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.g button{height:clamp(50px,8.6vh,70px);border-radius:36px;font-size:24px;padding:0}.g.s button{background:none;font-size:18px;height:40px}

.dev-name{font-size:11px;font-style:italic;color:#7af;text-shadow:0 0 6px rgba(100,160,255,.7),0 0 12px rgba(80,140,255,.35);animation:devPulse 2.4s ease-in-out infinite;white-space:nowrap;letter-spacing:.5px}
@keyframes devPulse{0%,100%{opacity:1;text-shadow:0 0 6px rgba(100,160,255,.7),0 0 12px rgba(80,140,255,.35)}50%{opacity:.7;text-shadow:0 0 4px rgba(100,160,255,.4),0 0 8px rgba(80,140,255,.2)}}
.warn-n{color:#4caf50}.warn-l{color:#ff9800}.warn-h{color:#ff5722}.warn-c{color:#f44336;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;margin-inline-start:6px}
.badge-n{background:rgba(76,175,80,.2);color:#4caf50}.badge-l{background:rgba(255,152,0,.2);color:#ff9800}
.badge-h{background:rgba(255,87,34,.2);color:#ff5722}.badge-c{background:rgba(244,67,54,.25);color:#f44336}
.sci-card{background:var(--c);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer;border:1px solid transparent}

.lab-card .abbr{direction:ltr;color:var(--a);font-weight:600}

.contact-card a{color:var(--a);text-decoration:none}
.bar-right{display:flex;align-items:center;gap:8px;margin-inline-start:auto}

.console-fab{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:16px;width:44px;height:44px;border-radius:14px;background:#1a2332;color:#7af;font-size:18px;padding:0;z-index:90;border:1px solid rgba(100,160,255,.35);box-shadow:0 0 10px rgba(80,140,255,.25);display:none}
.console-fab.has-err{color:#f66;border-color:rgba(255,80,80,.5);box-shadow:0 0 10px rgba(255,60,60,.3);animation:livePulse 1.6s ease-in-out infinite}
.console-panel{position:fixed;inset:auto 0 0 0;max-height:55%;background:var(--c);border-radius:18px 18px 0 0;z-index:100;display:none;flex-direction:column;box-shadow:0 -8px 32px rgba(0,0,0,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.console-panel.open{display:flex}
.console-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--k)}
.console-hd h2{flex:1;margin:0;font-size:16px}

.console-body .err-row.info{border-inline-start-color:#4caf50}

.console-body .err-msg{color:#f88;word-break:break-word;margin-top:4px}

.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.dev-grid button{font-size:13px;padding:12px 8px}
.app-title{text-align:center;font-size:28px;font-weight:800;letter-spacing:.5px;line-height:1.3;padding:2px 12px 0;margin:0;user-select:none;
background:linear-gradient(115deg,#7a5a08 0%,#c99700 14%,#ffd54f 28%,#fff8d6 38%,#ffd54f 48%,#b8860b 62%,#f5c518 78%,#fff2a8 88%,#7a5a08 100%);background-size:300% 300%;
-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(255,200,40,.35));animation:goldShine 4s linear infinite}

.rate-status{font-size:12px;color:var(--m);margin:6px 0}
.rate-status.ok{color:#4caf50}.rate-status.err{color:#f66}.rate-status.loading{color:var(--a)}

// ===== نظام تتبع الأخطاء (Developer Console) =====
const ERR_LOG=[];
const MAX_ERR=80;
function pushErr(type,msg,stack){
  const e={t:Date.now(),type:type||'error',msg:String(msg||''),stack:stack?String(stack).slice(0,800):''};
  ERR_LOG.unshift(e);if(ERR_LOG.length>MAX_ERR)ERR_LOG.pop();
  try{ST.s('errlog',ERR_LOG.slice(0,40))}catch(x){}
  updateConsoleBadge();
}
try{const saved=ST.g('errlog',[]);if(Array.isArray(saved))saved.forEach(e=>ERR_LOG.push(e))}catch(x){}
addEventListener('error',ev=>{pushErr('error',ev.message||ev.error||'Error',ev.error&&ev.error.stack);});
addEventListener('unhandledrejection',ev=>{const r=ev.reason;pushErr('error',r&&r.message?r.message:String(r),r&&r.stack);});
const _origErr=console.error.bind(console);
console.error=function(...a){try{pushErr('error',a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '))}catch(x){}_origErr(...a)};
const _origWarn=console.warn.bind(console);
console.warn=function(...a){try{pushErr('warn',a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '))}catch(x){}_origWarn(...a)};

function updateConsoleBadge(){
  const b=Q('#cfab');if(!b)return;
  const show=ST.g('showConsole',false);
  b.style.display=show?'flex':'none';
  const has=ERR_LOG.some(e=>e.type==='error');
  b.classList.toggle('has-err',has);
  b.title=has?L('أخطاء مسجّلة')+' ('+ERR_LOG.filter(e=>e.type==='error').length+')':L('وحدة التحكم');
}
function ensureConsoleUI(){
  if(Q('#cpanel'))return;
  const fab=E('button','console-fab','🛠');fab.id='cfab';fab.onclick=()=>toggleConsole();
  document.body.append(fab);
  const panel=E('div','console-panel');panel.id='cpanel';
  panel.innerHTML=`<div class="console-hd"><h2>🛠 ${L('وحدة التحكم')}</h2><button id=cclr type="button">${L('مسح')}</button><button id=ccls type="button">✕</button></div><div class="console-body" id=cbody></div>`;
  document.body.append(panel);
  Q('#ccls').onclick=()=>toggleConsole(false);
  Q('#cclr').onclick=()=>{ERR_LOG.length=0;ST.s('errlog',[]);renderConsole();updateConsoleBadge()};
  updateConsoleBadge();
}
function toggleConsole(force){
  ensureConsoleUI();
  const p=Q('#cpanel');
  const open=force===undefined?!p.classList.contains('open'):!!force;
  p.classList.toggle('open',open);
  if(open)renderConsole();
}
function renderConsole(){
  const b=Q('#cbody');if(!b)return;
  if(!ERR_LOG.length){b.innerHTML='<div style="color:var(--m);padding:16px;text-align:center">'+L('لا توجد سجلات')+'</div>';return}
  b.innerHTML=ERR_LOG.map(e=>{
    const d=new Date(e.t);
    const ts=d.toLocaleString(LC,{hour12:false});
    const cls=e.type==='warn'?'warn':e.type==='info'?'info':'';
    return `<div class="err-row ${cls}"><div class="err-ts">[${ts}] ${e.type.toUpperCase()}</div><div class="err-msg">${escHtml(e.msg)}</div>${e.stack?`<div class="err-stack">${escHtml(e.stack)}</div>`:''}</div>`;
  }).join('');
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function logInfo(msg){pushErr('info',msg);};

// ===== جلب أسعار الصرف من مصدر حي (Frankfurter/ECB + fallback) =====
// Frankfurter.app مبني على بيانات البنك المركزي الأوروبي (ECB) — مجاني بدون مفتاح
// open.er-api.com كاحتياطي لتغطية عملات إضافية
async function fetchLiveRates(){
  const codes=CUR.map(x=>x[2]).filter(c=>c&&c!=='USD');
  let rates={}, source='', date='';
  // 1) محاولة Frankfurter (ECB)
  try{
    const url='https://api.frankfurter.app/latest?from=USD&to='+codes.join(',');
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('Frankfurter HTTP '+res.status);
    const data=await res.json();
    if(data&&data.rates){
      rates={...data.rates};source='Frankfurter (ECB)';date=data.date||'';
      logInfo('Frankfurter rates OK: '+Object.keys(data.rates).length+' currencies, date '+date);
    }
  }catch(e){
    pushErr('warn','Frankfurter: '+(e.message||e));
  }
  // 2) احتياطي: open.er-api.com لتغطية العملات الناقصة
  const missing=codes.filter(c=>!rates[c]);
  if(missing.length){
    try{
      const res=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});
      if(!res.ok)throw new Error('open.er-api HTTP '+res.status);
      const data=await res.json();
      if(data&&data.rates){
        missing.forEach(c=>{if(data.rates[c])rates[c]=data.rates[c]});
        if(!source){source='ExchangeRate-API';date=data.time_last_update_utc||''}
        else source+=' + ExchangeRate-API (fill)';
        logInfo('open.er-api fill: '+missing.filter(c=>rates[c]).length+'/'+missing.length);
      }
    }catch(e){
      pushErr('warn','open.er-api: '+(e.message||e));
    }
  }
  if(!Object.keys(rates).length)throw new Error(L('تعذر جلب الأسعار من الشبكة'));
  // حفظ: الاسم العربي → السعر مقابل 1 USD
  const stored=ST.g('rt',{});
  CUR.forEach(([name,def,code])=>{
    if(code==='USD'){stored[name]=1;return}
    if(rates[code]>0)stored[name]=rates[code];
  });
  ST.s('rt',stored);
  ST.s('rtMeta',{source,date,at:Date.now()});
  return {rates,source,date,stored};
}

{id:'period',cat:'Waves',catAr:'الموجات',name:'الدور والتردد',nameEn:'Period & Frequency',sym:'T = 1/f',vars:[{k:'T',n:'الدور',u:'s'},{k:'f',n:'التردد',u:'Hz'}],calc:(v)=>{const o={};if(ok(v.f)&&v.f)o.T=1/v.f;if(ok(v.T)&&v.T)o.f=1/v.T;return o},exp:'الدور هو مقلوب التردد.'},
// Modern Physics
{id:'einstein',cat:'Modern Physics',catAr:'الفيزياء الحديثة',name:'كتلة-طاقة (أينشتاين)',nameEn:'Mass-Energy Equivalence',sym:'E = m·c²',vars:[{k:'E',n:'الطاقة',u:'J'},{k:'m',n:'الكتلة',u:'kg'}],calc:(v)=>{const c2=89875517873681764;const o={};if(ok(v.m))o.E=v.m*c2;if(ok(v.E))o.m=v.E/c2;return o},exp:'تكافؤ الكتلة والطاقة. c≈2.998×10⁸ m/s.'},
{id:'photo',cat:'Modern Physics',catAr:'الفيزياء الحديثة',name:'التأثير الكهروضوئي',nameEn:'Photoelectric Effect',sym:'E = h·f − φ',vars:[{k:'E',n:'الطاقة الحركية العظمى',u:'J'},{k:'f',n:'التردد',u:'Hz'},{k:'phi',n:'دالة الشغل φ',u:'J'}],calc:(v)=>{const h=6.62607015e-34;const o={};if(ok(v.f)&&ok(v.phi))o.E=h*v.f-v.phi;if(ok(v.E)&&ok(v.phi))o.f=(v.E+v.phi)/h;return o},exp:'طاقة الإلكترون المنبعث = طاقة الفوتون ناقص دالة الشغل.'},
// Chemistry
{id:'moles',cat:'Chemistry',catAr:'الكيمياء',name:'عدد المولات',nameEn:'Mole Calculation',sym:'n = m/M',vars:[{k:'n',n:'عدد المولات',u:'mol'},{k:'m',n:'الكتلة',u:'g'},{k:'M',n:'الكتلة المولية',u:'g/mol'}],calc:(v)=>{const o={};if(ok(v.m)&&ok(v.M)&&v.M)o.n=v.m/v.M;if(ok(v.n)&&ok(v.M))o.m=v.n*v.M;if(ok(v.n)&&ok(v.m)&&v.n)o.M=v.m/v.n;return o},exp:'عدد المولات = الكتلة / الكتلة المولية.'},
{id:'dilution',cat:'Chemistry',catAr:'الكيمياء',name:'قانون التخفيف',nameEn:'Dilution Law',sym:'C₁V₁ = C₂V₂',vars:[{k:'C1',n:'التركيز 1',u:'mol/L'},{k:'V1',n:'الحجم 1',u:'L'},{k:'C2',n:'التركيز 2',u:'mol/L'},{k:'V2',n:'الحجم 2',u:'L'}],calc:(v)=>{const o={};const k=['C1','V1','C2','V2'].map(x=>ok(v[x]));if(k.filter(Boolean).length<3)return o;if(!k[0]&&v.V1)o.C1=v.C2*v.V2/v.V1;else if(!k[1]&&v.C1)o.V1=v.C2*v.V2/v.C1;else if(!k[2]&&v.V2)o.C2=v.C1*v.V1/v.V2;else if(!k[3]&&v.C2)o.V2=v.C1*v.V1/v.C2;return o},exp:'عند التخفيف يبقى عدد المولات ثابتاً.'},
{id:'ph',cat:'Physical Chemistry',catAr:'الكيمياء الفيزيائية',name:'الأس الهيدروجيني pH',nameEn:'pH Calculation',sym:'pH = −log₁₀[H⁺]',vars:[{k:'pH',n:'pH',u:''},{k:'H',n:'[H⁺]',u:'mol/L'}],calc:(v)=>{const o={};if(ok(v.H)&&v.H>0)o.pH=-Math.log10(v.H);if(ok(v.pH))o.H=Math.pow(10,-v.pH);return o},exp:'مقياس حموضة المحلول. pH=7 متعادل عند 25°C.'},
{id:'beerlambert',cat:'Physical Chemistry',catAr:'الكيمياء الفيزيائية',name:'قانون بير-لامبرت',nameEn:'Beer-Lambert Law',sym:'A = ε·c·l',vars:[{k:'A',n:'الامتصاصية',u:''},{k:'eps',n:'معامل الامتصاص ε',u:'L/(mol·cm)'},{k:'c',n:'التركيز',u:'mol/L'},{k:'l',n:'طول المسار',u:'cm',def:1}],calc:(v)=>{const l=ok(v.l)?v.l:1;const o={};if(ok(v.eps)&&ok(v.c))o.A=v.eps*v.c*l;if(ok(v.A)&&ok(v.eps)&&ok(v.l)&&v.eps*l)o.c=v.A/(v.eps*l);return o},exp:'يربط امتصاص الضوء بتركيز المحلول.'},
{id:'density',cat:'Physical Chemistry',catAr:'الكيمياء الفيزيائية',name:'الكثافة',nameEn:'Density',sym:'ρ = m/V',vars:[{k:'rho',n:'الكثافة',u:'kg/m³'},{k:'m',n:'الكتلة',u:'kg'},{k:'V',n:'الحجم',u:'m³'}],calc:(v)=>{const o={};if(ok(v.m)&&ok(v.V)&&v.V)o.rho=v.m/v.V;if(ok(v.rho)&&ok(v.V))o.m=v.rho*v.V;if(ok(v.rho)&&ok(v.m)&&v.rho)o.V=v.m/v.rho;return o},exp:'الكثافة = الكتلة / الحجم.'},
{id:'avogadro',cat:'Atomic Chemistry',catAr:'الكيمياء الذرية',name:'عدد أفوجادرو',nameEn:"Avogadro's Number",sym:'N = n·N_A',vars:[{k:'N',n:'عدد الجسيمات',u:''},{k:'n',n:'عدد المولات',u:'mol'}],calc:(v)=>{const NA=6.02214076e23;const o={};if(ok(v.n))o.N=v.n*NA;if(ok(v.N))o.n=v.N/NA;return o},exp:'عدد الجسيمات في مول واحد ≈ 6.022×10²³.'}
,{id:'resultant',cat:'Mechanics',catAr:'الميكانيكا',name:'محصلة القوى',nameEn:'Resultant Force',sym:'R = √(ΣFx² + ΣFy²)',vars:[{k:'Fx',n:'مجموع Fx',u:'N'},{k:'Fy',n:'مجموع Fy',u:'N'},{k:'R',n:'المحصلة R',u:'N'},{k:'th',n:'الزاوية θ',u:'°'}],calc:(v)=>{const o={};if(ok(v.Fx)&&ok(v.Fy)){o.R=Math.sqrt(v.Fx*v.Fx+v.Fy*v.Fy);o.th=Math.atan2(v.Fy,v.Fx)*180/Math.PI}if(ok(v.R)&&ok(v.th)){const t=v.th*Math.PI/180;o.Fx=v.R*Math.cos(t);o.Fy=v.R*Math.sin(t)}return o},exp:'محصلة قوتين أو أكثر في المستوى: R=√(Fx²+Fy²) والزاوية tan⁻¹(Fy/Fx).'}
,{id:'friction',cat:'Mechanics',catAr:'الميكانيكا',name:'قوة الاحتكاك',nameEn:'Friction Force',sym:'f = μ·N',vars:[{k:'f',n:'قوة الاحتكاك',u:'N'},{k:'mu',n:'معامل الاحتكاك μ',u:''},{k:'N',n:'القوة العمودية N',u:'N'}],calc:(v)=>{const o={};if(ok(v.mu)&&ok(v.N))o.f=v.mu*v.N;if(ok(v.f)&&ok(v.N)&&v.N)o.mu=v.f/v.N;if(ok(v.f)&&ok(v.mu)&&v.mu)o.N=v.f/v.mu;return o},exp:'قوة الاحتكاك = معامل الاحتكاك × القوة العمودية.'}
,{id:'centrip',cat:'Mechanics',catAr:'الميكانيكا',name:'القوة الجاذبة المركزية',nameEn:'Centripetal Force',sym:'F = m·v²/r',vars:[{k:'F',n:'القوة',u:'N'},{k:'m',n:'الكتلة',u:'kg'},{k:'v',n:'السرعة',u:'m/s'},{k:'r',n:'نصف القطر',u:'m'}],calc:(v)=>{const o={};if(ok(v.m)&&ok(v.v)&&ok(v.r)&&v.r)o.F=v.m*v.v*v.v/v.r;if(ok(v.F)&&ok(v.m)&&ok(v.r)&&v.m&&v.r)o.v=Math.sqrt(v.F*v.r/v.m);return o},exp:'القوة اللازمة لحركة دائرية منتظمة.'}
,{id:'impulse',cat:'Mechanics',catAr:'الميكانيكا',name:'الدفع والتغير في الزخم',nameEn:'Impulse',sym:'J = F·Δt = Δp',vars:[{k:'J',n:'الدفع J',u:'N·s'},{k:'F',n:'القوة',u:'N'},{k:'dt',n:'الزمن Δt',u:'s'},{k:'dp',n:'تغير الزخم Δp',u:'kg·m/s'}],calc:(v)=>{const o={};if(ok(v.F)&&ok(v.dt))o.J=v.F*v.dt;if(ok(v.J)&&ok(v.dt)&&v.dt)o.F=v.J/v.dt;if(ok(v.J))o.dp=v.J;if(ok(v.dp))o.J=v.dp;return o},exp:'الدفع = القوة × الزمن = التغير في الزخم.'}
,{id:'torque',cat:'Mechanics',catAr:'الميكانيكا',name:'عزم الدوران',nameEn:'Torque',sym:'τ = F·r·sinθ',vars:[{k:'tau',n:'العزم τ',u:'N·m'},{k:'F',n:'القوة',u:'N'},{k:'r',n:'ذراع القوة',u:'m'},{k:'th',n:'الزاوية θ',u:'°',def:90}],calc:(v)=>{const th=(ok(v.th)?v.th:90)*Math.PI/180;const o={};if(ok(v.F)&&ok(v.r))o.tau=v.F*v.r*Math.sin(th);if(ok(v.tau)&&ok(v.F)&&ok(v.r)&&v.F*v.r)o.th=Math.asin(Math.min(1,Math.max(-1,v.tau/(v.F*v.r))))*180/Math.PI;return o},exp:'عزم الدوران = القوة × الذراع × جا الزاوية.'}
,{id:'hooke',cat:'Mechanics',catAr:'الميكانيكا',name:'قانون هوك',nameEn:"Hooke's Law",sym:'F = −k·x',vars:[{k:'F',n:'القوة',u:'N'},{k:'k',n:'ثابت النابض k',u:'N/m'},{k:'x',n:'الاستطالة x',u:'m'}],calc:(v)=>{const o={};if(ok(v.k)&&ok(v.x))o.F=-v.k*v.x;if(ok(v.F)&&ok(v.k)&&v.k)o.x=-v.F/v.k;if(ok(v.F)&&ok(v.x)&&v.x)o.k=-v.F/v.x;return o},exp:'القوة تتناسب طردياً مع الاستطالة ضمن حد المرونة.'}
,{id:'bernoulli',cat:'Fluids',catAr:'الموائع',name:'معادلة برنولي',nameEn:'Bernoulli Equation',sym:'P + ½ρv² + ρgh = const',vars:[{k:'P',n:'الضغط P',u:'Pa'},{k:'rho',n:'الكثافة ρ',u:'kg/m³',def:1000},{k:'v',n:'السرعة v',u:'m/s'},{k:'h',n:'الارتفاع h',u:'m'},{k:'g',n:'g',u:'m/s²',def:9.80665}],calc:(v)=>{const rho=ok(v.rho)?v.rho:1000,g=ok(v.g)?v.g:9.80665;const o={};if(ok(v.P)&&ok(v.v)&&ok(v.h))o.const=v.P+.5*rho*v.v*v.v+rho*g*v.h;return o},exp:'مجموع ضغط المائع وطاقة الحركة وطاقة الوضع ثابت على خط انسياب.'}
,{id:'continuity',cat:'Fluids',catAr:'الموائع',name:'معادلة الاستمرارية',nameEn:'Continuity Equation',sym:'A₁v₁ = A₂v₂',vars:[{k:'A1',n:'المقطع 1',u:'m²'},{k:'v1',n:'السرعة 1',u:'m/s'},{k:'A2',n:'المقطع 2',u:'m²'},{k:'v2',n:'السرعة 2',u:'m/s'}],calc:(v)=>{const o={};const k=['A1','v1','A2','v2'].map(x=>ok(v[x]));if(k.filter(Boolean).length<3)return o;if(!k[0]&&v.v1)o.A1=v.A2*v.v2/v.v1;else if(!k[1]&&v.A1)o.v1=v.A2*v.v2/v.A1;else if(!k[2]&&v.v2)o.A2=v.A1*v.v1/v.v2;else if(!k[3]&&v.A2)o.v2=v.A1*v.v1/v.A2;return o},exp:'معدل التدفق الحجمي ثابت لمائع غير قابل للانضغاط.'}
,{id:'pressure',cat:'Fluids',catAr:'الموائع',name:'الضغط الهيدروستاتيكي',nameEn:'Hydrostatic Pressure',sym:'P = ρ·g·h',vars:[{k:'P',n:'الضغط',u:'Pa'},{k:'rho',n:'الكثافة',u:'kg/m³',def:1000},{k:'g',n:'g',u:'m/s²',def:9.80665},{k:'h',n:'العمق h',u:'m'}],calc:(v)=>{const rho=ok(v.rho)?v.rho:1000,g=ok(v.g)?v.g:9.80665;const o={};if(ok(v.h))o.P=rho*g*v.h;if(ok(v.P)&&rho*g)o.h=v.P/(rho*g);return o},exp:'الضغط عند عمق h في مائع ساكن.'}
,{id:'ohm',cat:'Electricity',catAr:'الكهرباء',name:'قانون أوم',nameEn:"Ohm's Law",sym:'V = I·R',vars:[{k:'V',n:'الجهد V',u:'V'},{k:'I',n:'التيار I',u:'A'},{k:'R',n:'المقاومة R',u:'Ω'}],calc:(v)=>{const o={};if(ok(v.I)&&ok(v.R))o.V=v.I*v.R;if(ok(v.V)&&ok(v.R)&&v.R)o.I=v.V/v.R;if(ok(v.V)&&ok(v.I)&&v.I)o.R=v.V/v.I;return o},exp:'الجهد = التيار × المقاومة.'}
,{id:'joule',cat:'Electricity',catAr:'الكهرباء',name:'قانون جول',nameEn:"Joule's Law",sym:'H = I²·R·t',vars:[{k:'H',n:'الحرارة H',u:'J'},{k:'I',n:'التيار',u:'A'},{k:'R',n:'المقاومة',u:'Ω'},{k:'t',n:'الزمن',u:'s'}],calc:(v)=>{const o={};if(ok(v.I)&&ok(v.R)&&ok(v.t))o.H=v.I*v.I*v.R*v.t;return o},exp:'الطاقة الحرارية الناتجة عن مرور تيار في مقاومة.'}
,{id:'capacitance',cat:'Electricity',catAr:'الكهرباء',name:'سعة المكثف',nameEn:'Capacitance',sym:'C = Q/V',vars:[{k:'C',n:'السعة C',u:'F'},{k:'Q',n:'الشحنة Q',u:'C'},{k:'V',n:'الجهد V',u:'V'}],calc:(v)=>{const o={};if(ok(v.Q)&&ok(v.V)&&v.V)o.C=v.Q/v.V;if(ok(v.C)&&ok(v.V))o.Q=v.C*v.V;if(ok(v.C)&&ok(v.Q)&&v.C)o.V=v.Q/v.C;return o},exp:'السعة = الشحنة / الجهد.'}
,{id:'faraday',cat:'Electricity',catAr:'الكهرباء',name:'قانون فاراداي',nameEn:"Faraday's Law",sym:'ε = −N·ΔΦ/Δt',vars:[{k:'emf',n:'القوة الدافعة ε',u:'V'},{k:'N',n:'عدد اللفات N',u:'',def:1},{k:'dPhi',n:'تغير التدفق ΔΦ',u:'Wb'},{k:'dt',n:'الزمن Δt',u:'s'}],calc:(v)=>{const N=ok(v.N)?v.N:1;const o={};if(ok(v.dPhi)&&ok(v.dt)&&v.dt)o.emf=-N*v.dPhi/v.dt;return o},exp:'القوة الدافعة المستحثة تتناسب مع معدل تغير التدفق المغناطيسي.'}
,{id:'magnetic',cat:'Electricity',catAr:'الكهرباء',name:'القوة المغناطيسية',nameEn:'Magnetic Force',sym:'F = q·v·B·sinθ',vars:[{k:'F',n:'القوة',u:'N'},{k:'q',n:'الشحنة',u:'C'},{k:'v',n:'السرعة',u:'m/s'},{k:'B',n:'المجال B',u:'T'},{k:'th',n:'الزاوية θ',u:'°',def:90}],calc:(v)=>{const th=(ok(v.th)?v.th:90)*Math.PI/180;const o={};if(ok(v.q)&&ok(v.v)&&ok(v.B))o.F=Math.abs(v.q)*v.v*v.B*Math.sin(th);return o},exp:'قوة لورنتز على شحنة متحركة في مجال مغناطيسي.'}
,{id:'seriesR',cat:'Electricity',catAr:'الكهرباء',name:'مقاومات على التوالي',nameEn:'Series Resistance',sym:'Req = R₁+R₂+…',vars:[{k:'R1',n:'R₁',u:'Ω'},{k:'R2',n:'R₂',u:'Ω'},{k:'R3',n:'R₃',u:'Ω',def:0},{k:'Req',n:'Req',u:'Ω'}],calc:(v)=>{const o={};const rs=[v.R1,v.R2,v.R3].filter(ok);if(rs.length)o.Req=rs.reduce((a,b)=>a+b,0);return o},exp:'المقاومة المكافئة على التوالي = مجموع المقاومات.'}
,{id:'parallelR',cat:'Electricity',catAr:'الكهرباء',name:'مقاومات على التوازي',nameEn:'Parallel Resistance',sym:'1/Req = 1/R₁+1/R₂+…',vars:[{k:'R1',n:'R₁',u:'Ω'},{k:'R2',n:'R₂',u:'Ω'},{k:'R3',n:'R₃',u:'Ω',def:0},{k:'Req',n:'Req',u:'Ω'}],calc:(v)=>{const o={};const rs=[v.R1,v.R2,v.R3].filter(x=>ok(x)&&x);if(rs.length)o.Req=1/rs.reduce((a,b)=>a+1/b,0);return o},exp:'مقلوب المقاومة المكافئة على التوازي = مجموع مقاليب المقاومات.'}
,{id:'uniformAccel',cat:'Mechanics',catAr:'الميكانيكا',name:'حركة منتظمة التسارع',nameEn:'Uniform Acceleration',sym:'v = v₀+at ; s = v₀t+½at²',vars:[{k:'v0',n:'السرعة الابتدائية v₀',u:'m/s',def:0},{k:'v',n:'السرعة النهائية v',u:'m/s'},{k:'a',n:'التسارع a',u:'m/s²'},{k:'t',n:'الزمن t',u:'s'},{k:'s',n:'المسافة s',u:'m'}],calc:(v)=>{const o={};const v0=ok(v.v0)?v.v0:0;if(ok(v.v0)&&ok(v.a)&&ok(v.t)){o.v=v0+v.a*v.t;o.s=v0*v.t+.5*v.a*v.t*v.t}if(ok(v.v)&&ok(v.v0)&&ok(v.t)&&v.t)o.a=(v.v-v0)/v.t;if(ok(v.v)&&ok(v.v0)&&ok(v.a)&&v.a)o.t=(v.v-v0)/v.a;return o},exp:'معادلات الحركة بتسارع ثابت.'}
,{id:'freefall',cat:'Mechanics',catAr:'الميكانيكا',name:'السقوط الحر',nameEn:'Free Fall',sym:'h = ½gt² ; v = gt',vars:[{k:'h',n:'الارتفاع',u:'m'},{k:'t',n:'الزمن',u:'s'},{k:'v',n:'السرعة',u:'m/s'},{k:'g',n:'g',u:'m/s²',def:9.80665}],calc:(v)=>{const g=ok(v.g)?v.g:9.80665;const o={};if(ok(v.t)){o.h=.5*g*v.t*v.t;o.v=g*v.t}if(ok(v.h)&&g)o.t=Math.sqrt(2*v.h/g);return o},exp:'سقوط حر من السكون بتجاهل مقاومة الهواء.'}
,{id:'projectile',cat:'Mechanics',catAr:'الميكانيكا',name:'القذيفة (مدى وزمن)',nameEn:'Projectile Motion',sym:'R = v₀²sin(2θ)/g',vars:[{k:'v0',n:'السرعة الابتدائية',u:'m/s'},{k:'th',n:'زاوية الإطلاق θ',u:'°'},{k:'g',n:'g',u:'m/s²',def:9.80665},{k:'R',n:'المدى R',u:'m'},{k:'T',n:'زمن التحليق',u:'s'},{k:'H',n:'أقصى ارتفاع',u:'m'}],calc:(v)=>{const g=ok(v.g)?v.g:9.80665;const o={};if(ok(v.v0)&&ok(v.th)){const t=v.th*Math.PI/180;o.R=v.v0*v.v0*Math.sin(2*t)/g;o.T=2*v.v0*Math.sin(t)/g;o.H=v.v0*v.v0*Math.sin(t)*Math.sin(t)/(2*g)}return o},exp:'مدى وزمن وأقصى ارتفاع لقذيفة على أرض مستوية.'}
,{id:'grav',cat:'Mechanics',catAr:'الميكانيكا',name:'قانون الجذب العام',nameEn:'Universal Gravitation',sym:'F = G·m₁·m₂/r²',vars:[{k:'F',n:'القوة',u:'N'},{k:'m1',n:'الكتلة 1',u:'kg'},{k:'m2',n:'الكتلة 2',u:'kg'},{k:'r',n:'المسافة r',u:'m'}],calc:(v)=>{const G=6.6743e-11;const o={};if(ok(v.m1)&&ok(v.m2)&&ok(v.r)&&v.r)o.F=G*v.m1*v.m2/(v.r*v.r);return o},exp:'قوة الجذب بين كتلتين.'}
,{id:'waveSpeed',cat:'Waves',catAr:'الموجات',name:'سرعة الموجة',nameEn:'Wave Speed',sym:'v = f·λ',vars:[{k:'v',n:'السرعة',u:'m/s'},{k:'f',n:'التردد f',u:'Hz'},{k:'lam',n:'الطول الموجي λ',u:'m'}],calc:(v)=>{const o={};if(ok(v.f)&&ok(v.lam))o.v=v.f*v.lam;if(ok(v.v)&&ok(v.f)&&v.f)o.lam=v.v/v.f;if(ok(v.v)&&ok(v.lam)&&v.lam)o.f=v.v/v.lam;return o},exp:'سرعة الموجة = التردد × الطول الموجي.'}
,{id:'doppler',cat:'Waves',catAr:'الموجات',name:'تأثير دوبلر',nameEn:'Doppler Effect',sym:"f' = f·(v±vo)/(v±vs)",vars:[{k:'f',n:'التردد الأصلي f',u:'Hz'},{k:'v',n:'سرعة الصوت',u:'m/s',def:340},{k:'vo',n:'سرعة الراصد vo',u:'m/s',def:0},{k:'vs',n:'سرعة المصدر vs',u:'m/s',def:0},{k:'fp',n:"التردد المسموع f'",u:'Hz'}],calc:(v)=>{const vel=ok(v.v)?v.v:340,vo=ok(v.vo)?v.vo:0,vs=ok(v.vs)?v.vs:0;const o={};if(ok(v.f)&&vel!=vs)o.fp=v.f*(vel+vo)/(vel-vs);return o},exp:'تغير التردد بسبب حركة المصدر أو الراصد (اقتراب).'}
,{id:'snell2',cat:'Optics',catAr:'البصريات',name:'قانون سنل (تفصيلي)',nameEn:"Snell's Law",sym:'n₁sinθ₁ = n₂sinθ₂',vars:[{k:'n1',n:'n₁',u:'',def:1},{k:'th1',n:'θ₁',u:'°'},{k:'n2',n:'n₂',u:''},{k:'th2',n:'θ₂',u:'°'}],calc:(v)=>{const n1=ok(v.n1)?v.n1:1;const o={};if(ok(v.th1)&&ok(v.n2)&&v.n2){const s=n1*Math.sin(v.th1*Math.PI/180)/v.n2;if(Math.abs(s)<=1)o.th2=Math.asin(s)*180/Math.PI}if(ok(v.th2)&&ok(v.n2)&&n1){const s=v.n2*Math.sin(v.th2*Math.PI/180)/n1;if(Math.abs(s)<=1)o.th1=Math.asin(s)*180/Math.PI}return o},exp:'قانون الانكسار عند السطح الفاصل بين وسطين.'}
,{id:'mirror',cat:'Optics',catAr:'البصريات',name:'قانون المرايا والعدسات',nameEn:'Mirror/Lens Formula',sym:'1/f = 1/u + 1/v',vars:[{k:'f',n:'البعد البؤري f',u:'cm'},{k:'u',n:'بعد الجسم u',u:'cm'},{k:'v',n:'بعد الصورة v',u:'cm'}],calc:(v)=>{const o={};const k=['f','u','v'].map(x=>ok(v[x]));if(k.filter(Boolean).length<2)return o;if(!k[0]&&v.u&&v.v)o.f=1/(1/v.u+1/v.v);else if(!k[1]&&v.f&&v.v)o.u=1/(1/v.f-1/v.v);else if(!k[2]&&v.f&&v.u)o.v=1/(1/v.f-1/v.u);return o},exp:'العلاقة بين البعد البؤري وبعد الجسم وبعد الصورة.'}
,{id:'planck',cat:'Modern Physics',catAr:'الفيزياء الحديثة',name:'طاقة الفوتون (بلانك)',nameEn:'Photon Energy',sym:'E = h·f = hc/λ',vars:[{k:'E',n:'الطاقة E',u:'J'},{k:'f',n:'التردد f',u:'Hz'},{k:'lam',n:'الطول الموجي λ',u:'m'}],calc:(v)=>{const h=6.62607015e-34,c=299792458;const o={};if(ok(v.f))o.E=h*v.f;if(ok(v.lam)&&v.lam)o.E=h*c/v.lam;if(ok(v.E)){o.f=v.E/h;o.lam=h*c/v.E}return o},exp:'طاقة الفوتون تتناسب مع التردد.'}
,{id:'debroglie',cat:'Modern Physics',catAr:'الفيزياء الحديثة',name:'موجة دي برولي',nameEn:'de Broglie Wavelength',sym:'λ = h/p = h/(mv)',vars:[{k:'lam',n:'λ',u:'m'},{k:'m',n:'الكتلة',u:'kg'},{k:'v',n:'السرعة',u:'m/s'},{k:'p',n:'الزخم p',u:'kg·m/s'}],calc:(v)=>{const h=6.62607015e-34;const o={};if(ok(v.m)&&ok(v.v)&&v.m*v.v)o.lam=h/(v.m*v.v);if(ok(v.p)&&v.p)o.lam=h/v.p;if(ok(v.lam)&&v.lam)o.p=h/v.lam;return o},exp:'كل جسيم له طول موجي مرتبط بزخمه.'}
,{id:'pauli',cat:'Modern Physics',catAr:'الفيزياء الحديثة',name:'مبدأ باولي للاستبعاد',nameEn:'Pauli Exclusion Principle',sym:'لا إلكترونان بنفس الأعداد الكمية الأربعة',vars:[{k:'n',n:'العدد الكمّي الرئيسي n',u:'',def:1},{k:'l',n:'العدد الكمّي الثانوي l',u:'',def:0},{k:'ml',n:'المغناطيسي ml',u:'',def:0},{k:'ms',n:'اللف الذاتي ms',u:'',def:0.5}],calc:(v)=>{const o={};const n=ok(v.n)?v.n:1,l=ok(v.l)?v.l:0,ml=ok(v.ml)?v.ml:0,ms=ok(v.ms)?v.ms:0.5;o.info=(l>=n||l<0)?'l غير صالح (0≤l≤n−1)':(Math.abs(ml)>l)?'ml غير صالح (|ml|≤l)':(Math.abs(ms)!==0.5)?'ms يجب ±½':'الحالة الكمية مسموحة حسب باولي';return o},exp:'لا يمكن لإلكترونين في ذرة واحدة أن يشتركا في نفس قيم الأعداد الكمية الأربعة (n,l,ml,ms). مبدأ أساسي في بناء الجدول الدوري.'}
,{id:'halfLife',cat:'Modern Physics',catAr:'الفيزياء الحديثة',name:'عمر النصف',nameEn:'Half-Life',sym:'N = N₀·(½)^(t/T½)',vars:[{k:'N0',n:'العدد الابتدائي N₀',u:''},{k:'N',n:'العدد المتبقي N',u:''},{k:'t',n:'الزمن t',u:'s'},{k:'T',n:'عمر النصف T½',u:'s'}],calc:(v)=>{const o={};if(ok(v.N0)&&ok(v.t)&&ok(v.T)&&v.T)o.N=v.N0*Math.pow(0.5,v.t/v.T);if(ok(v.N)&&ok(v.N0)&&ok(v.T)&&v.N0&&v.T)o.t=v.T*Math.log(v.N/v.N0)/Math.log(0.5);return o},exp:'تناقص النشاط الإشعاعي إلى النصف كل فترة T½.'}
,{id:'boyle',cat:'Thermodynamics',catAr:'الديناميكا الحرارية',name:'قانون بويل',nameEn:"Boyle's Law",sym:'P₁V₁ = P₂V₂',vars:[{k:'P1',n:'P₁',u:'Pa'},{k:'V1',n:'V₁',u:'m³'},{k:'P2',n:'P₂',u:'Pa'},{k:'V2',n:'V₂',u:'m³'}],calc:(v)=>{const o={};const k=['P1','V1','P2','V2'].map(x=>ok(v[x]));if(k.filter(Boolean).length<3)return o;if(!k[0]&&v.V1)o.P1=v.P2*v.V2/v.V1;else if(!k[1]&&v.P1)o.V1=v.P2*v.V2/v.P1;else if(!k[2]&&v.V2)o.P2=v.P1*v.V1/v.V2;else if(!k[3]&&v.P2)o.V2=v.P1*v.V1/v.P2;return o},exp:'عند ثبات درجة الحرارة: الضغط × الحجم = ثابت.'}
,{id:'charles',cat:'Thermodynamics',catAr:'الديناميكا الحرارية',name:'قانون شارل',nameEn:"Charles's Law",sym:'V₁/T₁ = V₂/T₂',vars:[{k:'V1',n:'V₁',u:'m³'},{k:'T1',n:'T₁',u:'K'},{k:'V2',n:'V₂',u:'m³'},{k:'T2',n:'T₂',u:'K'}],calc:(v)=>{const o={};const k=['V1','T1','V2','T2'].map(x=>ok(v[x]));if(k.filter(Boolean).length<3)return o;if(!k[0]&&v.T1)o.V1=v.V2*v.T1/v.T2;else if(!k[1]&&v.V1)o.T1=v.V1*v.T2/v.V2;else if(!k[2]&&v.T2)o.V2=v.V1*v.T2/v.T1;else if(!k[3]&&v.V2)o.T2=v.V2*v.T1/v.V1;return o},exp:'عند ثبات الضغط: الحجم / درجة الحرارة المطلقة = ثابت.'}
,{id:'calorimetry',cat:'Thermodynamics',catAr:'الديناميكا الحرارية',name:'المسعرية (Q=mcΔT)',nameEn:'Calorimetry',sym:'Q = m·c·ΔT',vars:[{k:'Q',n:'الحرارة Q',u:'J'},{k:'m',n:'الكتلة',u:'kg'},{k:'c',n:'الحرارة النوعية c',u:'J/(kg·K)'},{k:'dT',n:'ΔT',u:'K'}],calc:(v)=>{const o={};if(ok(v.m)&&ok(v.c)&&ok(v.dT))o.Q=v.m*v.c*v.dT;if(ok(v.Q)&&ok(v.m)&&ok(v.c)&&v.m*v.c)o.dT=v.Q/(v.m*v.c);return o},exp:'كمية الحرارة اللازمة لتغيير درجة حرارة جسم.'}
,
// ===== معادلات إضافية موسّعة =====
{id:'circMotion',cat:'Mechanics',catAr:'الميكانيكا',name:'الحركة الدائرية (سرعة زاوية)',nameEn:'Circular motion (angular)',sym:'v = ω·r ; a = ω²·r',vars:[{k:'v',n:'السرعة الخطية',u:'m/s'},{k:'w',n:'السرعة الزاوية ω',u:'rad/s'},{k:'r',n:'نصف القطر',u:'m'},{k:'a',n:'التسارع المركزي',u:'m/s²'}],calc:(v)=>{const o={};if(ok(v.w)&&ok(v.r)){o.v=v.w*v.r;o.a=v.w*v.w*v.r}if(ok(v.v)&&ok(v.r)&&v.r)o.w=v.v/v.r;if(ok(v.a)&&ok(v.r)&&v.r)o.w=Math.sqrt(v.a/v.r);return o},exp:'العلاقة بين السرعة الخطية والزاوية والتسارع المركزي.'},
{id:'powerMech',cat:'Mechanics',catAr:'الميكانيكا',name:'القدرة الميكانيكية',nameEn:'Mechanical Power',sym:'P = W/t = F·v',vars:[{k:'P',n:'القدرة',u:'W'},{k:'W',n:'الشغل',u:'J'},{k:'t',n:'الزمن',u:'s'},{k:'F',n:'القوة',u:'N'},{k:'v',n:'السرعة',u:'m/s'}],calc:(v)=>{const o={};if(ok(v.W)&&ok(v.t)&&v.t)o.P=v.W/v.t;if(ok(v.F)&&ok(v.v))o.P=v.F*v.v;if(ok(v.P)&&ok(v.t))o.W=v.P*v.t;if(ok(v.P)&&ok(v.v)&&v.v)o.F=v.P/v.v;return o},exp:'القدرة = الشغل/الزمن أو القوة×السرعة.'},
{id:'elasticPE',cat:'Mechanics',catAr:'الميكانيكا',name:'طاقة الوضع المرنة',nameEn:'Elastic Potential Energy',sym:'PE = ½·k·x²',vars:[{k:'PE',n:'طاقة الوضع المرنة',u:'J'},{k:'k',n:'ثابت النابض k',u:'N/m'},{k:'x',n:'الاستطالة x',u:'m'}],calc:(v)=>{const o={};if(ok(v.k)&&ok(v.x))o.PE=0.5*v.k*v.x*v.x;if(ok(v.PE)&&ok(v.k)&&v.k)o.x=Math.sqrt(2*v.PE/v.k);if(ok(v.PE)&&ok(v.x)&&v.x)o.k=2*v.PE/(v.x*v.x);return o},exp:'طاقة النابض المخزّنة عند الاستطالة.'},
{id:'rangeAngle',cat:'Mechanics',catAr:'الميكانيكا',name:'مدى القذيفة (زاوية)',nameEn:'Projectile range',sym:'R = v₀²·sin(2θ)/g',vars:[{k:'R',n:'المدى',u:'m'},{k:'v0',n:'السرعة الابتدائية',u:'m/s'},{k:'th',n:'الزاوية θ',u:'°'},{k:'g',n:'الجاذبية',u:'m/s²',def:9.80665}],calc:(v)=>{const g=ok(v.g)?v.g:9.80665;const o={};if(ok(v.v0)&&ok(v.th)){const th=v.th*Math.PI/180;o.R=v.v0*v.v0*Math.sin(2*th)/g}return o},exp:'أقصى مدى أفقي للقذيفة.'},
{id:'escapeVel',cat:'Mechanics',catAr:'الميكانيكا',name:'سرعة الإفلات',nameEn:'Escape velocity',sym:'v_esc = √(2GM/R)',vars:[{k:'v',n:'سرعة الإفلات',u:'m/s'},{k:'M',n:'كتلة الجرم',u:'kg'},{k:'R',n:'نصف القطر',u:'m'}],calc:(v)=>{const G=6.67430e-11;const o={};if(ok(v.M)&&ok(v.R)&&v.R)o.v=Math.sqrt(2*G*v.M/v.R);return o},exp:'الحد الأدنى للسرعة لمغادرة مجال الجاذبية.'},
{id:'periodOrbit',cat:'Mechanics',catAr:'الميكانيكا',name:'دورة مدار دائري (كبلر)',nameEn:'Orbital period',sym:'T² = 4π²·a³/(GM)',vars:[{k:'T',n:'الدورة T',u:'s'},{k:'a',n:'نصف المحور الأكبر',u:'m'},{k:'M',n:'كتلة الجرم المركزي',u:'kg'}],calc:(v)=>{const G=6.67430e-11;const o={};if(ok(v.a)&&ok(v.M)&&v.M)o.T=2*Math.PI*Math.sqrt(v.a*v.a*v.a/(G*v.M));return o},exp:'قانون كبلر الثالث للمدارات الدائرية.'},
{id:'seriesC',cat:'Electricity',catAr:'الكهرباء',name:'مكثفات على التوالي',nameEn:'Capacitors in series',sym:'1/C = 1/C₁ + 1/C₂',vars:[{k:'C1',n:'C₁',u:'F'},{k:'C2',n:'C₂',u:'F'},{k:'C',n:'المكافئة C',u:'F'}],calc:(v)=>{const o={};if(ok(v.C1)&&ok(v.C2)&&v.C1&&v.C2)o.C=1/(1/v.C1+1/v.C2);return o},exp:'المكثفات على التوالي: مقلوب المكافئة = مجموع المقلوبات.'},
{id:'parallelC',cat:'Electricity',catAr:'الكهرباء',name:'مكثفات على التوازي',nameEn:'Capacitors in parallel',sym:'C = C₁ + C₂',vars:[{k:'C1',n:'C₁',u:'F'},{k:'C2',n:'C₂',u:'F'},{k:'C',n:'المكافئة C',u:'F'}],calc:(v)=>{const o={};if(ok(v.C1)&&ok(v.C2))o.C=v.C1+v.C2;return o},exp:'المكثفات على التوازي تُجمع مباشرة.'},
{id:'rcTime',cat:'Electricity',catAr:'الكهرباء',name:'ثابت زمن دائرة RC',nameEn:'RC time constant',sym:'τ = R·C',vars:[{k:'tau',n:'τ',u:'s'},{k:'R',n:'المقاومة',u:'Ω'},{k:'C',n:'السعة',u:'F'}],calc:(v)=>{const o={};if(ok(v.R)&&ok(v.C))o.tau=v.R*v.C;if(ok(v.tau)&&ok(v.R)&&v.R)o.C=v.tau/v.R;if(ok(v.tau)&&ok(v.C)&&v.C)o.R=v.tau/v.C;return o},exp:'الزمن اللازم لشحن/تفريغ المكثف بنسبة ~63%.'},
{id:'energyC',cat:'Electricity',catAr:'الكهرباء',name:'طاقة المكثف',nameEn:'Capacitor energy',sym:'U = ½·C·V²',vars:[{k:'U',n:'الطاقة',u:'J'},{k:'C',n:'السعة',u:'F'},{k:'V',n:'الجهد',u:'V'}],calc:(v)=>{const o={};if(ok(v.C)&&ok(v.V))o.U=0.5*v.C*v.V*v.V;if(ok(v.U)&&ok(v.C)&&v.C)o.V=Math.sqrt(2*v.U/v.C);return o},exp:'الطاقة المخزّنة في المكثف.'},
{id:'transformer',cat:'Electricity',catAr:'الكهرباء',name:'المحوّل الكهربائي',nameEn:'Transformer',sym:'Vₛ/Vₚ = Nₛ/Nₚ',vars:[{k:'Vp',n:'جهد الابتدائي Vₚ',u:'V'},{k:'Vs',n:'جهد الثانوي Vₛ',u:'V'},{k:'Np',n:'لفات الابتدائي',u:''},{k:'Ns',n:'لفات الثانوي',u:''}],calc:(v)=>{const o={};if(ok(v.Vp)&&ok(v.Np)&&ok(v.Ns)&&v.Np)o.Vs=v.Vp*v.Ns/v.Np;if(ok(v.Vs)&&ok(v.Np)&&ok(v.Ns)&&v.Ns)o.Vp=v.Vs*v.Np/v.Ns;return o},exp:'نسبة الجهود = نسبة عدد اللفات.'},
{id:'rms',cat:'Electricity',catAr:'الكهرباء',name:'القيمة الفعالة RMS',nameEn:'RMS value',sym:'V_rms = V₀/√2',vars:[{k:'V0',n:'القيمة العظمى V₀',u:'V'},{k:'Vrms',n:'القيمة الفعالة',u:'V'}],calc:(v)=>{const o={};if(ok(v.V0))o.Vrms=v.V0/Math.SQRT2;if(ok(v.Vrms))o.V0=v.Vrms*Math.SQRT2;return o},exp:'القيمة الفعالة للجهد أو التيار المتناوب.'},
{id:'efficiency',cat:'Thermodynamics',catAr:'الديناميكا الحرارية',name:'كفاءة المحرك الحراري',nameEn:'Heat engine efficiency',sym:'η = 1 − T_C/T_H',vars:[{k:'eta',n:'الكفاءة η',u:'(0–1)'},{k:'TH',n:'درجة الحرارة الساخنة T_H',u:'K'},{k:'TC',n:'درجة الحرارة الباردة T_C',u:'K'}],calc:(v)=>{const o={};if(ok(v.TH)&&ok(v.TC)&&v.TH)o.eta=1-v.TC/v.TH;return o},exp:'كفاءة كارنو النظرية للمحرك الحراري.'},
{id:'gaylussac',cat:'Thermodynamics',catAr:'الديناميكا الحرارية',name:'قانون جاي-لوساك',nameEn:"Gay-Lussac Law",sym:'P₁/T₁ = P₂/T₂',vars:[{k:'P1',n:'P₁',u:'Pa'},{k:'T1',n:'T₁',u:'K'},{k:'P2',n:'P₂',u:'Pa'},{k:'T2',n:'T₂',u:'K'}],calc:(v)=>{const o={};if(ok(v.P2)&&ok(v.T1)&&ok(v.T2)&&v.T2)o.P1=v.P2*v.T1/v.T2;if(ok(v.P1)&&ok(v.T1)&&ok(v.T2)&&v.T1)o.P2=v.P1*v.T2/v.T1;return o},exp:'عند ثبات الحجم: الضغط يتناسب طردياً مع درجة الحرارة المطلقة.'},
{id:'combinedGas',cat:'Thermodynamics',catAr:'الديناميكا الحرارية',name:'قانون الغازات العام',nameEn:'Combined Gas Law',sym:'P₁V₁/T₁ = P₂V₂/T₂',vars:[{k:'P1',n:'P₁',u:'Pa'},{k:'V1',n:'V₁',u:'m³'},{k:'T1',n:'T₁',u:'K'},{k:'P2',n:'P₂',u:'Pa'},{k:'V2',n:'V₂',u:'m³'},{k:'T2',n:'T₂',u:'K'}],calc:(v)=>{const o={};if(ok(v.P1)&&ok(v.V1)&&ok(v.T1)&&ok(v.V2)&&ok(v.T2)&&v.V2&&v.T1)o.P2=v.P1*v.V1*v.T2/(v.T1*v.V2);return o},exp:'يجمع قوانين بويل وشارل وجاي-لوساك.'},
{id:'beatFreq',cat:'Waves',catAr:'الموجات',name:'تردد التداخل (الضربات)',nameEn:'Beat frequency',sym:'f_beat = |f₁ − f₂|',vars:[{k:'f1',n:'f₁',u:'Hz'},{k:'f2',n:'f₂',u:'Hz'},{k:'fb',n:'تردد الضربات',u:'Hz'}],calc:(v)=>{const o={};if(ok(v.f1)&&ok(v.f2))o.fb=Math.abs(v.f1-v.f2);return o},exp:'عدد مرات السماع المتقطع في الثانية عند تداخل موجتين.'},
{id:'stringHarmonic',cat:'Waves',catAr:'الموجات',name:'وتر مهتز (التوافقيات)',nameEn:'String harmonics',sym:'f_n = n·v/(2L)',vars:[{k:'fn',n:'التردد f_n',u:'Hz'},{k:'n',n:'رقم التوافقية n',u:'',def:1},{k:'v',n:'سرعة الموجة',u:'m/s'},{k:'L',n:'طول الوتر',u:'m'}],calc:(v)=>{const n=ok(v.n)?v.n:1;const o={};if(ok(v.v)&&ok(v.L)&&v.L)o.fn=n*v.v/(2*v.L);return o},exp:'تردد التوافقية رقم n لوتر مثبت الطرفين.'},

function labStatus(test,val){
  if(!ok(val))return null;
  const{low,high,critLow,critHigh}=test;
  if(critLow!=null&&val<critLow)return'c';
  if(critHigh!=null&&val>critHigh)return'c';
  if(low!=null&&val<low)return'l';
  if(high!=null&&val>high)return'h';
  return'n';
}
function labBadge(st){
  if(st=='n')return'<span class="badge badge-n">'+L('طبيعي')+'</span>';
  if(st=='l')return'<span class="badge badge-l">'+L('منخفض')+'</span>';
  if(st=='h')return'<span class="badge badge-h">'+L('مرتفع')+'</span>';
  if(st=='c')return'<span class="badge badge-c">'+L('حرج')+'</span>';
  return'';
}
function labWarn(st){
  if(st=='c')return'<div class="disc warn-c">⚠️ '+L('قيمة حرجة: يُنصح بمراجعة مختص رعاية صحية فوراً. هذه المعلومات تعليمية وليست تشخيصاً طبياً.')+'</div>';
  if(st=='l'||st=='h')return'<div class="disc warn-h">⚠️ '+L('القيمة خارج النطاق المرجعي الشائع. راجع مختصاً للتفسير. النطاقات تختلف بين المختبرات.')+'</div>';
  if(st=='n')return'<div class="disc warn-n">✓ '+L('ضمن النطاق المرجعي التقريبي.')+'</div>';
  return'';
}

    const c=SYM[sel.value],w=c[3];g.innerHTML='';
    const cols=w?1:6;
    g.style.cssText='display:grid;gap:6px;margin-top:6px;direction:ltr;grid-template-columns:repeat('+cols+',1fr)';
    const parts=c[2].split(w?';':' ');

    parts.forEach((s,i)=>{
      if(!s.trim())return;
      const b=E('button',0);b.textContent=s;
      b.style.cssText='padding:10px 4px;font-size:'+(w?'12':'16')+'px;'+(w?'text-align:left;':'')+'border-radius:10px';
      if(c[2]===EL)b.title=String(i+1);
      b.onclick=()=>{ta.value+=s;ta.focus()};
      g.append(b);
    });
  };
  sel.onchange=draw;
  cl.onclick=()=>{ta.value='';ans.textContent='—'};
  cp.onclick=async()=>{
    const t=ta.value.trim()||ans.textContent;

  };
  const tryEval=()=>{
    let s=ta.value.trim();
    if(!s){ans.textContent='—';return}
    s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/∞/g,'Infinity')
      .replace(/√\(/g,'Math.sqrt(').replace(/√([0-9.]+)/g,'Math.sqrt($1)')
      .replace(/\^/g,'**').replace(/(\d)([a-zA-Zα-ωΑ-Ω])/g,'$1*$2')
      .replace(/(\))(\()/g,'$1*$2').replace(/(\d)(\()/g,'$1*$2');
    try{
      const cleaned=s.replace(/Math\.(PI|sqrt|abs|sin|cos|tan|log|exp|pow)/g,'');
      if(/[^0-9+\-*/().,eE\s]/.test(cleaned)){
        ans.textContent=AR?'(تعبير رمزي — للنسخ)':'(symbolic — for copy)';
        return;
      }
      const r=Function('"use strict";return ('+s+')')();
      ans.textContent=(typeof r==='number'&&isFinite(r)?fm(r):String(r));
    }catch(e){ans.textContent=AR?'(تعبير رمزي — للنسخ)':'(symbolic — for copy)'}
  };
  ev.onclick=tryEval;
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();tryEval()}});
  wrap.append(
    E('label',0,AR?'المعادلة / التعبير':'Equation / Expression'),ta,
    ansBox,bar,
    E('label',0,AR?'أرقام وعمليات':'Numbers & Ops'),ops,
    E('label',0,AR?'المجاهيل':'Variables'),vars,
    E('label',0,AR?'فئات الرموز':'Symbol categories'),sel,g
  );
  sc.append(wrap);draw();
}

async function fetchMetalPrices(){
  const stored=ST.g('metals',{});
  let source='Coinbase',okCount=0;
  for(const m of METALS_DB){
    if(!m.code)continue;
    try{
      const res=await fetch('https://api.coinbase.com/v2/prices/'+m.code+'-USD/spot',{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      const amt=parseFloat(data&&data.data&&data.data.amount);
      if(amt>0){stored[m.id]=amt;okCount++;}
    }catch(e){pushErr('warn','Metal '+m.code+': '+(e.message||e));}
  }
  if(okCount===0)throw new Error(L('تعذر جلب أسعار المعادن'));
  ST.s('metals',stored);
  ST.s('metalsMeta',{source,at:Date.now(),count:okCount});
  return {stored,source,count:okCount};
}
